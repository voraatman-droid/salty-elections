<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffda16">
<title>Who’s the Saltiest? · Monaco × SOCIAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@500;700&display=swap');
:root{--yellow:#ffda16;--blue:#153f9b;--ink:#172641;--red:#d5322b;--cream:#fffbea}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--yellow);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;display:flex;flex-direction:column}.checker{height:14px;background:conic-gradient(var(--blue) 25%,var(--yellow) 0 50%,var(--blue) 0 75%,var(--yellow) 0) 0 0/28px 28px}header{padding:26px 24px;display:flex;justify-content:center;align-items:center;gap:14px}.monaco{font:bold italic 29px Georgia,serif;color:var(--blue);text-shadow:1px 1px white}.social{font:900 25px 'Barlow Condensed',Impact,sans-serif;letter-spacing:2px;color:#111}main{width:min(100%,580px);margin:auto;padding:32px 24px 60px;text-align:center}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--blue);margin:0 0 12px}h1{font:900 clamp(43px,10vw,64px)/.95 'Barlow Condensed',Impact,sans-serif;margin:0 0 32px;text-transform:uppercase;color:var(--red)}.card{background:var(--cream);border:2px solid var(--blue);box-shadow:6px 6px 0 var(--blue);padding:38px 28px;min-height:255px;display:grid;place-items:center;margin-bottom:29px}h2{font:800 clamp(32px,7.5vw,46px)/1.1 'Barlow Condensed',Impact,sans-serif;margin:0;overflow-wrap:anywhere;color:var(--ink)}button{width:100%;min-height:58px;border:2px solid var(--blue);border-radius:3px;background:var(--blue);color:white;font:700 16px 'DM Sans',Arial,sans-serif;padding:17px 20px;box-shadow:3px 3px 0 #102961;cursor:pointer}button:hover{background:#102f76}button:focus-visible{outline:3px solid var(--red);outline-offset:5px}footer{text-align:center;font:800 15px 'Barlow Condensed',Impact,sans-serif;letter-spacing:1px;color:var(--blue);padding:0 20px 25px}@media(max-width:380px){main{padding:22px 20px 40px}.card{padding:30px 22px;min-height:240px}}
</style>
</head>
<body><div class="checker" aria-hidden="true"></div><header aria-label="Monaco and SOCIAL"><span class="monaco">Monaco</span><span>×</span><span class="social">S[#]CIAL</span></header>
<main><p class="eyebrow">THE SALTY ELECTIONS</p><h1>Who’s the saltiest?</h1><section class="card" aria-label="Question"><h2 id="question" aria-live="polite" aria-atomic="true">Who said “just one bite” and lied?</h2></section><button id="randomize" type="button">Randomize questions</button></main>
<footer>VOTE KARO. SADA SALTY RAHO.</footer><script src="game.js"></script></body></html>
